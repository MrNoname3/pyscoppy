name: CI

# Runs on Gitea Actions, which also reads .github/workflows. The job is the
# release gate developers run locally, so local green means CI green.
# Managed by repo-template: changes here are overwritten by its next update.
on:
  push:
    branches: ['**']        # Renovate's branches too: main's protection requires this status
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a hung step (a stalled download) fails instead of idling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the release gate (same script as local runs)
        run: ./scripts/check.sh
